<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunrise & Sunset Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sunrise & Sunset Dashboard</h1>
    <p>Data from <a href="https://sunrisesunset.io/api/" target="_blank">sunrisesunset.io</a></p>
  </header>

  <main>
    <section class="controls">
      <select id="locationSelect">
        <option value="">-- Select a Location --</option>
        <option value="40.7128,-74.0060">New York, USA</option>
        <option value="34.0522,-118.2437">Los Angeles, USA</option>
        <option value="51.5074,-0.1278">London, UK</option>
        <option value="35.6895,139.6917">Tokyo, Japan</option>
        <option value="-33.8688,151.2093">Sydney, Australia</option>
        <option value="48.8566,2.3522">Paris, France</option>
        <option value="55.7558,37.6173">Moscow, Russia</option>
        <option value="19.0760,72.8777">Mumbai, India</option>
        <option value="39.9042,116.4074">Beijing, China</option>
        <option value="-23.5505,-46.6333">São Paulo, Brazil</option>
      </select>
      <button id="currentLocationBtn">Use My Current Location</button>
    </section>

    <section id="dashboard">
      <p class="placeholder">Select a location or use your current location to view data.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 ITMD 541 – Khushi Prajapati</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
